<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>THE CIRCLE &middot; {{titel}}</title>
<!--
  THE CIRCLE - die eine Vorlage fuer alles, was nach dem Abend kommt.
  Galerie offen, News, Feedback, "Ihr habt euch verbunden", Save-the-Date:
  das sind Anlaesse, keine eigenen Vorlagen. Verschickt aus dem Monitor
  ueber /api/admin/senden, neben der Push.

  Merge-Variablen: {{anrede}} {{vorname}} {{titel}} {{text_html}}
                   {{cta_text}} {{cta_url}} {{app_link}} {{logo_url}}
                   {{abmelden_url}}
-->
<style>
  @media screen {
    @font-face { font-family: 'Circle Kapitalis'; font-style: normal; font-weight: normal;
      src: url(https://thecircle.planyvo.com/assets/cinzel-600.woff2) format('woff2'); }
  }
  @media (prefers-color-scheme: dark) {
    body, .bg-aussen { background-color: #222222 !important; }
    .bg-karte { background-color: #122648 !important; }
  }
  [data-ogsb] body, [data-ogsb] .bg-aussen { background-color: #222222 !important; }
  [data-ogsb] .bg-karte { background-color: #122648 !important; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#222222;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{{titel}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#222222" class="bg-aussen" style="background-color:#222222;">
    <tr><td align="center" style="padding:28px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#122648" class="bg-karte" style="max-width:600px;width:100%;background-color:#122648;">
        <tr><td align="center" style="padding:36px 40px 0 40px;">
          <img src="{{logo_url}}" alt="THE CIRCLE" width="150" style="display:block;width:150px;height:auto;border:0;">
        </td></tr>
        <tr><td align="center" style="padding:30px 40px 0 40px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:4px;color:#7a8db3;text-transform:uppercase;">THE CIRCLE No1 &middot; connecting generations</div>
          <div style="font-family:'Circle Kapitalis','Trajan Pro 3','Trajan Pro','Cinzel',Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:2px;color:#f8f7f4;padding-top:14px;line-height:1.3;">{{titel}}</div>
        </td></tr>
        <tr><td style="padding:28px 44px 0 44px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.75;color:#d5dbe8;">
            {{anrede}} {{vorname}},<br><br>
            {{text_html}}
          </div>
        </td></tr>
        <tr><td align="center" style="padding:32px 40px 8px 40px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td align="center" bgcolor="#ff6b6c" style="border-radius:999px;">
              <a href="{{cta_url}}" target="_blank"
                 style="display:inline-block;padding:16px 44px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#331014;font-weight:bold;text-decoration:none;">{{cta_text}}</a>
            </td>
          </tr></table>
        </td></tr>
        <tr><td align="center" style="padding:6px 40px 0 40px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:9px;letter-spacing:2px;color:#7a8db3;text-transform:uppercase;line-height:2;">Dein Link ist pers&ouml;nlich &middot; bitte nicht weiterleiten</div>
        </td></tr>
        <tr><td style="padding:32px 64px 0 64px;"><div style="border-top:1px solid #33507f;font-size:0;line-height:0;">&nbsp;</div></td></tr>
        <tr><td align="center" style="padding:24px 40px 36px 40px;">
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:9px;letter-spacing:3px;color:#7a8db3;text-transform:uppercase;">Eine Veranstaltung von</div>
          <div style="font-family:'Circle Kapitalis','Cinzel',Georgia,'Times New Roman',serif;font-size:14px;letter-spacing:1px;color:#aeb9d2;padding-top:8px;text-transform:uppercase;">Ihre Markenwerkstatt &middot; AERA &middot; Public Cologne</div>
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#7a8db3;padding-top:18px;line-height:1.8;">
            <a href="{{abmelden_url}}" style="color:#7a8db3;">Keine weiteren Nachrichten zu THE CIRCLE</a>
          </div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
