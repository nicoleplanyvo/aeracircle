<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Akkreditierung · THE CIRCLE</title>
<!--
  Die Seite fuer den Einlass. Eine Aufgabe: Wer steht vor mir, und ist er
  schon drin? Deshalb keine Navigation, keine Untermenues, keine Zahlen,
  die niemand braucht - ein Suchfeld, eine Liste, ein Knopf je Zeile.

  Sie kennt bewusst weniger als der Monitor: Der Schluessel in der Adresse
  darf Namen abhaken und sonst nichts. Das Tablet am Einlass geht durch
  viele Haende, und ein verlorenes Geraet soll kein Problem sein, sondern
  eine Minute Arbeit (Zugang im Monitor erneuern).

  Gebaut fuer den Daumen: grosse Treffflaechen, Suchfeld oben am Rand,
  die Liste darunter scrollbar. Wer am Einlass steht, haelt das Geraet in
  einer Hand und einen Stift in der anderen.
-->
<style>
  :root{
    --tinte:#0e1c39; --papier:#f6f5f2; --karte:#fff; --linie:#e3e0d9;
    --grau:#6b7280; --gruen:#1b7a3e; --gruenhell:#e6f4ea;
    --rot:#b3261e; --gold:#c8a15a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --tinte:#f2f1ee; --papier:#14161a; --karte:#1c1f25; --linie:#2d323b;
           --grau:#9aa2ae; --gruenhell:#173224; --gruen:#5ec27e; }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--papier); color:var(--tinte);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* --- Kopf: bleibt stehen, die Liste laeuft darunter durch --- */
  header{flex:none; padding:14px 16px 10px; border-bottom:1px solid var(--linie); background:var(--karte)}
  .zeile{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; opacity:.62}
  .zaehler{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
  .zaehler b{font-size:21px}
  .suchreihe{display:flex; gap:8px; margin-top:10px}
  input[type=search]{
    flex:1; min-width:0; font:inherit; font-size:17px; padding:13px 14px;
    border:1px solid var(--linie); border-radius:12px;
    background:var(--papier); color:var(--tinte); -webkit-appearance:none;
  }
  input[type=search]:focus{outline:2px solid var(--gold); outline-offset:-1px}
  .leeren{
    flex:none; font:inherit; font-size:15px; padding:0 16px; border:1px solid var(--linie);
    border-radius:12px; background:var(--karte); color:var(--grau); cursor:pointer;
  }
  .filter{display:flex; gap:6px; margin-top:9px}
  .filter button{
    font:inherit; font-size:14px; padding:8px 14px; border:1px solid var(--linie);
    border-radius:999px; background:var(--karte); color:var(--grau); cursor:pointer;
  }
  .filter button[aria-pressed=true]{background:var(--tinte); color:var(--papier); border-color:var(--tinte)}

  /* --- Liste --- */
  main{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 12px 28px}
  .gast{
    display:flex; align-items:center; gap:12px;
    background:var(--karte); border:1px solid var(--linie); border-radius:14px;
    padding:12px 12px 12px 14px; margin:8px 0;
  }
  .gast.drin{background:var(--gruenhell); border-color:transparent}
  .wer{flex:1; min-width:0}
  .name{font-size:17px; font-weight:600; overflow-wrap:anywhere}
  /* Zwei knappe Zeilen statt einer langen, die umbricht: Am Einlass will
     man senkrecht durch die Liste lesen, und ungleich hohe Zeilen machen
     das langsam. Firma oben, Platz und Nummer darunter und leiser. */
  .firma{font-size:13.5px; color:var(--grau); margin-top:2px; overflow-wrap:anywhere}
  .platz{font-size:13px; color:var(--grau); opacity:.78; margin-top:1px;
         font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
  .platz.ohne{color:var(--gold); opacity:1}
  .haken{
    flex:none; font:inherit; font-size:15px; font-weight:600;
    padding:12px 18px; min-width:118px; border:0; border-radius:999px;
    background:var(--tinte); color:var(--papier); cursor:pointer;
  }
  .gast.drin .haken{background:transparent; color:var(--gruen); border:1px solid currentColor; min-width:118px}
  .haken:disabled{opacity:.45}
  .hinweis{text-align:center; color:var(--grau); padding:40px 20px; font-size:15px}
  .hinweis b{display:block; font-size:18px; color:var(--tinte); margin-bottom:6px}

  /* --- Fuss: der Scanner ist der schnellere Weg, also steht er fest da --- */
  footer{flex:none; border-top:1px solid var(--linie); background:var(--karte); padding:10px 16px 14px}
  footer a{
    display:block; text-align:center; text-decoration:none;
    font-size:16px; font-weight:600; padding:14px; border-radius:12px;
    background:var(--tinte); color:var(--papier);
  }
  .fnote{text-align:center; font-size:12.5px; color:var(--grau); margin-top:8px}

  /* Kurze Rueckmeldung nach jedem Haken - am Einlass sieht niemand auf
     den Bildschirm, waehrend er tippt. */
  #toast{
    /* Ueber dem Fuss, nicht darauf: der Scanner-Knopf ist der meist-
       benutzte auf dieser Seite und darf nie halb verdeckt sein. */
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 124px);
    transform:translate(-50%,14px);
    background:var(--tinte); color:var(--papier); padding:11px 18px; border-radius:999px;
    font-size:15px; font-weight:600; opacity:0; pointer-events:none; transition:.18s; z-index:9;
    max-width:calc(100% - 32px); text-align:center;
  }
  #toast.an{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="zeile">
    <h1>Akkreditierung</h1>
    <span class="zaehler"><b id="zDa">–</b> <span id="zVon"></span></span>
  </div>
  <div class="suchreihe">
    <input type="search" id="suche" placeholder="Name oder Firma" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="leeren" type="button" id="leeren">Leeren</button>
  </div>
  <div class="filter">
    <button type="button" data-f="offen" aria-pressed="true">Noch nicht da</button>
    <button type="button" data-f="da" aria-pressed="false">Schon da</button>
    <button type="button" data-f="alle" aria-pressed="false">Alle</button>
  </div>
</header>

<main id="liste">
  <p class="hinweis"><b>Einen Moment</b>Die Gästeliste wird geladen.</p>
</main>

<footer>
  <a href="/einlass" id="scannerLink">QR-Code scannen</a>
  <p class="fnote" id="fuss">Wer seinen Code nicht findet, wird oben gesucht und abgehakt.</p>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const K = new URLSearchParams(location.search).get("k") || "";

let GAESTE = [], TISCHNAME = {}, FILTER = "offen";
/* Die Zeilen, die gerade beim Server sind - damit ein zweiter Tipp auf
   denselben Knopf nicht ein zweites Mal losgeht. */
const laeuft = new Set();

function toast(text){
  const t = $("#toast");
  t.textContent = text; t.classList.add("an");
  clearTimeout(toast._z);
  toast._z = setTimeout(() => t.classList.remove("an"), 2200);
}

/* Umlaute und Akzente raus, damit "Uenlue" auch "Ünlü" findet - am Einlass
   tippt niemand Sonderzeichen. */
function flach(s){
  return String(s || "").toLowerCase()
    .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

async function holen(){
  const a = await fetch("/api/einlass/liste?k=" + encodeURIComponent(K), { cache:"no-store" });
  if(a.status === 401){
    $("#liste").innerHTML = '<p class="hinweis"><b>Kein Zugang</b>Dieser Link gilt nicht mehr. ' +
      'Im Monitor unter Einlass einen neuen holen.</p>';
    return false;
  }
  if(!a.ok) throw new Error(a.status);
  const d = await a.json();
  GAESTE = d.gaeste || [];
  TISCHNAME = d.tischName || {};
  $("#zDa").textContent = d.daZahl;
  $("#zVon").textContent = "von " + d.im + " im Haus";
  return true;
}

function zeichnen(){
  const suchwort = flach($("#suche").value.trim());
  let liste = GAESTE;
  if(FILTER === "offen") liste = liste.filter(g => !g.da);
  else if(FILTER === "da") liste = liste.filter(g => g.da);
  if(suchwort) liste = liste.filter(g => flach(g.name).includes(suchwort) || flach(g.firma).includes(suchwort));

  const m = $("#liste");
  if(!liste.length){
    m.innerHTML = '<p class="hinweis"><b>Niemand</b>' +
      (suchwort ? "Zu dieser Suche steht niemand auf der Liste." : "Diese Auswahl ist leer.") + "</p>";
    return;
  }
  m.textContent = "";
  for(const g of liste){
    const zeile = document.createElement("div");
    zeile.className = "gast" + (g.da ? " drin" : "");

    const wer = document.createElement("div");
    wer.className = "wer";
    const nm = document.createElement("div");
    nm.className = "name"; nm.textContent = g.name;
    const fi = document.createElement("div");
    fi.className = "firma"; fi.textContent = g.firma || "";

    const pl = document.createElement("div");
    pl.className = "platz";
    if(g.tisch){
      /* Die Tische heissen nach den Partnern, so wie die Schilder im Raum.
         Die Nummer steht nirgends auf einem Schild und hilft hier keinem -
         sie bleibt nur die Rueckfallebene fuer einen Tisch ohne Namen. */
      const tn = TISCHNAME[g.tisch] || "";
      pl.textContent = (tn || "Tisch " + g.tisch) + (g.nr ? "   " + g.nr : "");
    } else {
      pl.classList.add("ohne");
      pl.textContent = "kein Tischplatz" + (g.nr ? "   " + g.nr : "");
    }

    wer.append(nm);
    if(g.firma) wer.append(fi);
    wer.append(pl);

    const knopf = document.createElement("button");
    knopf.className = "haken"; knopf.type = "button";
    knopf.textContent = g.da ? "Ist da ✓" : "Einchecken";
    knopf.disabled = laeuft.has(g.gid);
    knopf.addEventListener("click", () => haken(g));

    zeile.append(wer, knopf);
    m.append(zeile);
  }
}

async function haken(g){
  if(laeuft.has(g.gid)) return;
  const soll = !g.da;
  /* Zurueckholen ist der seltene Fall und der, den man nicht aus Versehen
     tun will - also einmal nachfragen. Einchecken geht ohne Rueckfrage:
     Am Einlass steht jemand davor und wartet. */
  if(!soll && !confirm(g.name + " wieder als nicht anwesend führen?")) return;

  laeuft.add(g.gid); zeichnen();
  try{
    const a = await fetch("/api/einlass/da?k=" + encodeURIComponent(K), {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ gid:g.gid, da:soll })
    });
    if(!a.ok) throw new Error(a.status);
    const d = await a.json();
    g.da = d.da || 0;
    $("#zDa").textContent = GAESTE.filter(x => x.da).length;
    toast(soll ? (g.name.split(" ")[0] + " ist da.") : (g.name.split(" ")[0] + " zurückgenommen."));
  }catch(e){
    toast("Ging gerade nicht – nochmal tippen.");
  }finally{
    laeuft.delete(g.gid); zeichnen();
  }
}

$("#suche").addEventListener("input", zeichnen);
$("#leeren").addEventListener("click", () => { $("#suche").value = ""; zeichnen(); $("#suche").focus(); });
document.querySelectorAll(".filter button").forEach(b => b.addEventListener("click", () => {
  FILTER = b.dataset.f;
  document.querySelectorAll(".filter button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  zeichnen();
}));

/* Der Scanner braucht denselben Weg zurueck - sonst landet das Team nach
   jedem Gast auf einer Seite ohne Liste. */
$("#scannerLink").href = "/einlass";

(async function start(){
  if(!K){
    $("#liste").innerHTML = '<p class="hinweis"><b>Kein Zugang</b>' +
      'Diesem Link fehlt der Schlüssel. Im Monitor unter Einlass den vollständigen Link holen.</p>';
    return;
  }
  try{
    if(await holen()) zeichnen();
  }catch(e){
    $("#liste").innerHTML = '<p class="hinweis"><b>Keine Verbindung</b>Die Liste lädt gleich von selbst nach.</p>';
  }
  /* Alle zwanzig Sekunden nachziehen: Am Einlass stehen zwei Geraete, und
     der Scanner checkt ebenfalls ein. Wer hier abhakt, soll dort nicht
     gleich noch einmal gefragt werden. Waehrend jemand tippt oder sucht,
     wird nicht neu gezeichnet - sonst springt die Liste unter dem Daumen. */
  setInterval(async () => {
    if(laeuft.size) return;
    try{
      if(await holen()) zeichnen();
    }catch(e){ /* stumm: der naechste Versuch kommt in zwanzig Sekunden */ }
  }, 20000);
})();
</script>
</body>
</html>
